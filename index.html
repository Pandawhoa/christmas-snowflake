<html lang="zh-Hant-TW">
<head>

<title>聖誕雪花賀卡</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e2257'/%3E%3Cg stroke='%23fff' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M32 8v48M11 20l42 24M11 44l42-24'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--text:#f3f6ff;--muted:#b9c6e8;--line:rgba(255,255,255,.18);--gold:#ffe2a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#050d26;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Heiti TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none}
body.mode-card{overflow:hidden;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #9cc3ff;outline-offset:2px}
#scene{position:fixed;left:0;top:0;width:100%;height:100%;display:block;z-index:0}

/* ---------- 設計模式 ---------- */
#designer{position:relative;z-index:1;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.d-title{font-size:clamp(21px,6vw,27px);font-weight:700;letter-spacing:.14em;text-align:center;margin:4px 0 4px;
  color:#fff;text-shadow:0 0 14px rgba(150,200,255,.55)}
.d-title small{display:block;font-family:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT","Dancing Script",cursive;
  font-size:.62em;font-weight:400;letter-spacing:.04em;color:var(--gold);margin-bottom:2px}
.d-sub{margin:0;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
.pad-wrap{position:relative;width:100%;max-width:440px;margin:10px auto 6px}
.pad-wrap::before{content:"";display:block;padding-top:100%}
#pad{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:crosshair;border-radius:50%}
.pad-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;color:rgba(225,236,255,.85);
  font-size:15px;text-align:center;line-height:1.7;transition:opacity .4s;text-shadow:0 1px 6px rgba(0,0,30,.8);width:70%}
.pad-hint b{display:block;font-size:17px;color:#fff}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.tbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;min-height:60px;border-radius:14px;
  background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.17);color:#eef3ff;font-size:13.5px;line-height:1.2}
.tbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn:active{transform:scale(.97)}
.tbtn[aria-pressed="true"]{background:rgba(255,217,138,.2);border-color:rgba(255,217,138,.65);color:#ffe7b3}
.tbtn:disabled{opacity:.38;cursor:default}
.tbtn.accent{background:rgba(120,170,255,.18);border-color:rgba(150,190,255,.5)}
.row-thick{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 2px;font-size:14px;color:var(--muted)}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#dfe8ff;padding:6px 18px;border-radius:999px;font-size:14px;min-height:36px}
.seg button[aria-checked="true"]{background:#e9f1ff;color:#13244f;font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;border-radius:14px;font:inherit;font-size:16px;font-weight:700;
  border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.1);color:#fff;text-decoration:none;padding:0 14px;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(180deg,#e9604f,#c3362e);border-color:#f2948a;box-shadow:0 6px 18px rgba(200,50,40,.35)}
.btn.line{background:#06c755;border-color:#3ee08a}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);font-weight:400;min-height:44px}
.foot{margin:18px 0 0;text-align:center;font-size:12px;color:rgba(200,212,240,.85);line-height:1.6;text-shadow:0 1px 4px rgba(0,0,20,.9)}

/* ---------- 分享面板 ---------- */
.sheet{position:fixed;left:0;top:0;width:100%;height:100%;z-index:20;background:rgba(2,6,20,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{width:100%;max-width:520px;background:#12224f;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 14px);box-shadow:0 -10px 40px rgba(0,0,0,.45);animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
.sheet-card h2{margin:0 0 4px;font-size:19px;text-align:center}
.sheet-sub{margin:0 0 12px;text-align:center;color:var(--muted);font-size:14px}
#linkOut{width:100%;font:inherit;font-size:13px;color:#dfe9ff;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:10px;
  -webkit-user-select:text;user-select:text}
.meta{margin:6px 2px 12px;font-size:12px;color:var(--muted)}
.sheet-btns{display:grid;gap:10px}

/* ---------- 卡片模式 ---------- */
#card{position:fixed;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none}
#card .hit{pointer-events:auto}
.xmas{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 1.6vh);margin:0;padding:0 56px;text-align:center;
  font-family:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT","Dancing Script",cursive;font-weight:400;
  font-size:clamp(30px,min(9.6vw,11vh),62px);color:#fff4d6;letter-spacing:.02em;line-height:1.25;
  text-shadow:0 0 10px rgba(255,214,140,.75),0 0 28px rgba(255,190,90,.35)}
.fade{opacity:0;transform:translateY(10px);transition:opacity 1.3s ease,transform 1.3s ease}
.fade.show{opacity:1;transform:none}
#sound{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(255,255,255,.28);background:rgba(10,24,60,.55);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
#sound svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#sound .waves,#sound .cross,#sound .note{display:none}
#sound.playing .waves{display:inline}
#sound.muted .cross{display:inline}
#sound.idle .note{display:inline}
#sound.idle{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,226,160,.5)}50%{box-shadow:0 0 0 8px rgba(255,226,160,0)}}
#tapHint{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;font-size:13px;color:#eef3ff;padding:6px 14px;border-radius:999px;
  background:rgba(10,24,60,.62);bottom:calc(env(safe-area-inset-bottom,0px) + 64px);transition:opacity .8s}
#tapHint.fade{transform:translate(-50%,10px)}#tapHint.fade.show{transform:translateX(-50%)}
.card-foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:999px;font-size:14px;color:#fff;text-decoration:none;
  background:rgba(12,26,66,.72);border:1px solid rgba(255,255,255,.3);box-shadow:0 4px 14px rgba(0,0,30,.35)}
.pill.strong{background:rgba(195,54,46,.9);border-color:#f2948a}

/* ---------- 錯誤 / 載入 ---------- */
.center-box{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:min(88vw,420px);text-align:center;padding:24px 20px;border-radius:20px;
  background:rgba(10,22,58,.82);border:1px solid var(--line);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.center-box h2{margin:0 0 8px;font-size:20px}
.center-box p{margin:0 0 18px;color:#d5def7;line-height:1.7;font-size:15px}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:40;max-width:88vw;
  background:rgba(255,255,255,.95);color:#13244f;padding:10px 16px;border-radius:12px;font-size:14px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.fade{transition-duration:.3s}#sound.idle{animation:none}}
</style>

<script>
'use strict';
/* =====================================================================
 * 設定
 * ---------------------------------------------------------------------
 * CONFIG.storage：短網址儲存介面（目前未設定 → 使用「資料放在網址 #c=」的備援方式）
 *
 * 若之後申請了免費的 JSON key-value 儲存服務，可改成：
 *
 * CONFIG.storage = {
 *   // data：已壓縮編碼的卡片字串（約 50~300 字元，僅含 A-Z a-z 0-9 - _）
 *   // 回傳：短代碼字串（只能含 A-Z a-z 0-9 - _，1~64 字）
 *   async saveCard(data) {
 *     const res = await fetch('https://YOUR-KV-SERVICE.example.com/api/cards', {
 *       method: 'POST',
 *       headers: { 'Content-Type': 'application/json' },
 *       body: JSON.stringify({ c: data })
 *     });
 *     if (!res.ok) throw new Error('save failed ' + res.status);
 *     const json = await res.json();           // 例如 { "id": "a8Kx2q" }
 *     return json.id;
 *   },
 *   // code：網址 #s= 後面的短代碼；回傳當初存進去的 data 字串
 *   async loadCard(code) {
 *     const res = await fetch('https://YOUR-KV-SERVICE.example.com/api/cards/' + encodeURIComponent(code));
 *     if (!res.ok) throw new Error('load failed ' + res.status);
 *     const json = await res.json();           // 例如 { "c": "IR..." }
 *     return json.c;
 *   }
 * };
 *
 * 設定後產生的連結會是 …/#s=短代碼；儲存失敗時會自動退回 #c= 長連結，不會讓使用者卡住。
 * ===================================================================== */
const CONFIG = {
  storage: null,
  pointBudget: 220,      // 整片雪花（單一扇形）最多儲存的點數，超過會自動再簡化
  draftKey: 'snowflake-card-draft-v4'
};

// ==CORE-BEGIN==
/* 純邏輯（不依賴 DOM）：幾何、雪花結晶生成、編碼／解碼。tests/ 會直接抽出這段在 Node 測試。
 *
 * 筆畫有兩種：
 *  - 鏡射筆畫 m=true：存在 30° 基本扇形內，畫成 12 份（6 個方向 × 鏡射）。隨機結晶與舊版 v1/v2 連結都是這種。
 *  - 旋轉筆畫 m=false：手繪筆畫，存在整個圓內，只畫成 6 份（純六角旋轉，不鏡射）。 */
const Core = (function () {
  const VERSION = 4;
  const SEG = Math.PI / 3, HALF = Math.PI / 6, SQ3 = Math.sqrt(3);
  const QX = 255, QY = 127, YMAX = 0.5;           // 鏡射筆畫：扇形內 x∈[0,1] 8 bits、y∈[0,0.5] 7 bits
  const QR = 511;                                  // v3 旋轉筆畫：x,y∈[-1,1] 各 9 bits
  const QS = 510;                                  // v4 線段／六角形的位置：x,y∈[-1,1] 各 9 bits（0 剛好落在格點上）
  const MAX_STROKES = 120, MAX_PTS_STROKE = 128;
  const WIDTHS_LEGACY = [0.017, 0.028, 0.043];     // v1/v2 連結的線寬（保持原樣）
  const WIDTHS = [0.0105, 0.017, 0.027];           // v3：較細、較俐落
  const LEGACY_LIMITS = { to: 12, msg: 60, from: 12 };   // 舊版 v1 連結的文字欄位（只用於驗證）
  const LEGACY_PRESETS = [
    '聖誕快樂！願你的冬天溫暖又閃亮。',
    '這片雪花是我親手畫的，送給你，祝你平安喜樂。',
    '願新的一年，好運像雪花一樣紛紛落下。',
    '謝謝你這一年的陪伴，聖誕快樂！'
  ];
  const td = new TextDecoder('utf-8', { fatal: true });

  /* ---------- 幾何 ---------- */
  function fold(x, y) {                      // 映射到基本扇形 θ∈[0,30°]
    let r = Math.hypot(x, y);
    if (r > 1) r = 1;
    if (r < 1e-9) return [0, 0];
    let a = Math.atan2(y, x);
    a = ((a % SEG) + SEG) % SEG;
    if (a > HALF) a = SEG - a;
    return [r * Math.cos(a), r * Math.sin(a)];
  }
  function clampR(p, max) { max = max || 1; const r = Math.hypot(p[0], p[1]); return r > max ? [p[0] / r * max, p[1] / r * max] : [p[0], p[1]]; }
  const clampI = (v, hi) => v < 0 ? 0 : v > hi ? hi : v;
  function quant(p, m) {
    if (m === false) return [clampI(Math.round((p[0] + 1) / 2 * QR), QR), clampI(Math.round((p[1] + 1) / 2 * QR), QR)];
    return [clampI(Math.round(p[0] * QX), QX), clampI(Math.round(p[1] / YMAX * QY), QY)];
  }
  function dequant(q, m) {
    if (m === false) return [q[0] / QR * 2 - 1, q[1] / QR * 2 - 1];
    return [q[0] / QX, q[1] / QY * YMAX];
  }
  function segDist(p, a, b) {
    const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
    let t = L2 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
  }
  function rdp(pts, eps) {                   // Ramer–Douglas–Peucker（非遞迴）
    const n = pts.length;
    if (n < 3) return pts.slice();
    const keep = new Uint8Array(n); keep[0] = keep[n - 1] = 1;

    showCard(card, true);
  });

  let currentLink = '';
  $('btnMake').addEventListener('click', async () => {
    const c = validate(); if (!c) return;
    let payload;
    try { payload = Core.encode(c); Core.decode(payload); } catch (e) { toast('產生連結失敗，請簡化雪花後再試'); return; }
    let link = baseUrl() + '#c=' + payload;
    if (CONFIG.storage && typeof CONFIG.storage.saveCard === 'function') {
      $('btnMake').disabled = true;
      try {
        const code = await CONFIG.storage.saveCard(payload);
        if (typeof code === 'string' && /^[A-Za-z0-9_-]{1,64}$/.test(code)) link = baseUrl() + '#s=' + code;
      } catch (e) { toast('短網址服務暫時無法使用，改用一般連結', 2400); }
      $('btnMake').disabled = false;
    }
    currentLink = link;
    $('linkOut').value = link;
    $('linkMeta').textContent = '連結長度 ' + link.length + ' 字元（資料部分 ' + (link.length - baseUrl().length) + ' 字元）';
    $('btnLine').href = 'https://line.me/R/share?text=' + encodeURIComponent(SHARE_TEXT + '\n' + link);
    $('btnShare').hidden = !navigator.share;
    $('sheet').hidden = false;
    setTimeout(() => (navigator.share ? $('btnShare') : $('btnCopy')).focus(), 50);
  });
  $('btnShare').addEventListener('click', async () => {
    try { await navigator.share({ title: '送你一片聖誕雪花', text: SHARE_TEXT, url: currentLink }); }
    catch (e) { if (e && e.name !== 'AbortError') toast('無法開啟分享，請改用「複製連結」'); }
  });
  $('btnCopy').addEventListener('click', async () => {
    const ok = await copyText(currentLink);
    if (ok) toast('已複製連結，貼到 LINE 傳給對方吧！');
    else { const i = $('linkOut'); i.focus(); i.select(); try { i.setSelectionRange(0, i.value.length); } catch (e) { /* ignore */ } toast('請長按上方連結，手動複製', 3200); }
  });
  $('linkOut').addEventListener('focus', (e) => e.target.select());
  $('btnCloseSheet').addEventListener('click', () => { $('sheet').hidden = true; });
  $('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) $('sheet').hidden = true; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('sheet').hidden) $('sheet').hidden = true; });

  async function copyText(t) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch (e) { /* fallback */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0'; ta.style.opacity = '0'; ta.style.fontSize = '16px';
      document.body.appendChild(ta);
      ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }

  // 草稿保存（離開再回來不會不見）
  let saveT = 0;
  function saveDraft() {
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      if (!D.strokes.length) { try { localStorage.removeItem(CONFIG.draftKey); } catch (e) { /* ignore */ } return; }
      try { localStorage.setItem(CONFIG.draftKey, JSON.stringify({ v: Core.VERSION, c: Core.encode(currentCard()) })); } catch (e) { /* 無痕或 in-app 可能禁止 */ }
    }, 300);
  }
  function loadDraft() {
    try {
      const o = JSON.parse(localStorage.getItem(CONFIG.draftKey) || 'null');
      if (!o || o.v !== Core.VERSION || !o.c) return;
      const d = Core.decode(o.c);
      D.strokes = d.strokes.map(s => s.t ? s : Object.assign(s, { exact: true, dense: s.q.map(q => Core.dequant(q, s.m)) }));
      D.beautify = d.beautify;
    } catch (e) { /* ignore */ }
  }

  function showDesigner() {
    $('errorBox').hidden = true; $('loadingBox').hidden = true; $('card').hidden = true;
    body.classList.remove('mode-card'); body.classList.add('mode-designer');
    Scene.setMode('designer');
    $('designer').hidden = false;
    if (!designerReady) {
      designerReady = true;
      loadDraft();
      let rt = 0;
      window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(padResize, 120); });
    }
    padResize();
    window.scrollTo(0, designerScroll || 0);
  }
  window.addEventListener('resize', () => { if (cardActive) setTimeout(() => Scene.relayout(), 200); });

  /* ---------------- 啟動 ---------------- */
  function boot() {
    Scene.init();
    const p = readParams();
    if (p.c) {
      let card = null;
      try { card = Core.decode(p.c); } catch (e) { card = null; }
      if (card) showCard(card, false); else showError();
    } else if (p.s) {
      if (CONFIG.storage && typeof CONFIG.storage.loadCard === 'function' && /^[A-Za-z0-9_-]{1,64}$/.test(p.s)) {
        $('loadingBox').hidden = false;
        body.classList.add('mode-card'); body.classList.remove('mode-designer');
        Promise.resolve().then(() => CONFIG.storage.loadCard(p.s)).then((payload) => showCard(Core.decode(payload), false))
          .catch(() => showError('找不到這張卡片，可能連結有誤或網路不穩，請稍後再試。'));
      } else showError('這個短網址目前無法讀取，請向寄件人索取完整連結。');
    } else showDesigner();
    window.addEventListener('hashchange', () => location.reload());
    window.__snowflake = { Core, Music, Scene, D, getLink: () => currentLink };   // 測試用
  }
  boot();
})();
</script>
</body>
</html>
